{% load static %}
<!DOCTYPE html>
<html lang="en">

	<head>

		<meta charset="UTF-8">

			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<title>JH Classes - Student Portal</title>

				<style>

					* {
					box-sizing: border-box;
					}

					body {
					margin: 0;
					font-family: Arial, sans-serif;
					background: #f4f7fb;
					color: #102a56;
					}

					/* =========================
					TOP HEADER
					========================= */

					.topbar {
					height: 76px;
					background: linear-gradient(135deg, #063b91, #0878e8);
					color: white;
					display: flex;
					align-items: center;
					justify-content: space-between;
					padding: 0 25px;
					position: fixed;
					top: 0;
					left: 0;
					right: 0;
					z-index: 1000;
					box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
					}

					.topbar-left {
					display: flex;
					align-items: center;
					gap: 12px;
					}

					.logo {
					height: 62px;
					width: auto;
					object-fit: contain;
					}

					.brand-text h2 {
					margin: 0;
					font-size: 21px;
					font-weight: 700;
					}

					.brand-text p {
					margin: 3px 0 0;
					color: #ffd21c;
					font-size: 11px;
					font-weight: 700;
					}

					.student-info {
					display: flex;
					align-items: center;
					gap: 12px;
					}

					.student-details {
					text-align: right;
					}

					.student-details strong {
					display: block;
					font-size: 14px;
					}

					.student-details span {
					display: block;
					font-size: 12px;
					margin-top: 3px;
					opacity: 0.9;
					}

					.student-circle {
					width: 44px;
					height: 44px;
					border-radius: 50%;
					background: #ffd21c;
					color: #063b91;
					display: flex;
					align-items: center;
					justify-content: center;
					font-weight: 700;
					font-size: 17px;
					}

					/* =========================
					SIDEBAR
					========================= */

					.sidebar {
					width: 238px;
					height: calc(100vh - 78px);
					background: #082f70;
					position: fixed;
					left: 0;
					top: 76px;
					padding: 22px 12px;
					z-index: 900;
					}

					.sidebar-title {
					color: #a9c9ff;
					font-size: 11px;
					font-weight: 700;
					text-transform: uppercase;
					letter-spacing: 1px;
					padding: 0 14px 12px;
					}

					.sidebar a {
					display: flex;
					align-items: center;
					gap: 12px;
					padding: 14px 15px;
					margin-bottom: 6px;
					border-radius: 10px;
					color: white;
					text-decoration: none;
					font-size: 15px;
					transition: 0.2s;
					}

					.sidebar a:hover {
					background: rgba(255, 255, 255, 0.12);
					}

					.nav-icon {
					width: 25px;
					text-align: center;
					font-size: 18px;
					}

					.sidebar-divider {
					height: 1px;
					background: rgba(255, 255, 255, 0.18);
					margin: 20px 8px;
					}

					/* =========================
					CONTENT
					========================= */

					.content {
					margin-left: 238px;
					padding: 108px 30px 40px;
					min-height: 100vh;
					}

					/* =========================
					TABLES
					========================= */

					table {
					border-collapse: collapse;
					width: 100%;
					background: white;
					border-radius: 10px;
					overflow: hidden;
					}

					table,
					th,
					td {
					border: 1px solid #e1e7ef;
					}

					th,
					td {
					padding: 11px;
					text-align: left;
					}

					th {
					background: #eef4fb;
					color: #102a56;
					}

					/* =========================
					MOBILE
					========================= */

					@media (max-width: 700px) {

					.topbar {
					height: 70px;
					padding: 0 14px;
					}

					.logo {
					height: 52px;
					}

					.brand-text {
					display: none;
					}

					.student-details {
					display: none;
					}

					.student-circle {
					width: 38px;
					height: 38px;
					font-size: 15px;
					}

					.sidebar {
					width: 100%;
					height: 70px;
					position: fixed;
					top: auto;
					bottom: 0;
					left: 0;
					padding: 5px;
					display: flex;
					justify-content: space-around;
					background: #082f70;
					z-index: 1000;
					}

					.sidebar-title,
					.sidebar-divider {
					display: none;
					}

					.sidebar a {
					flex: 1;
					margin: 0;
					padding: 6px 3px;
					border-radius: 8px;
					display: flex;
					flex-direction: column;
					justify-content: center;
					align-items: center;
					gap: 2px;
					font-size: 10px;
					}

					.nav-icon {
					width: auto;
					font-size: 18px;
					}

					.content {
					margin-left: 0;
					padding: 84px 14px 90px;
					}

					table {
					font-size: 13px;
					}

					th,
					td {
					padding: 8px;
					}

					}

				</style>

			</head>

	<body>

		<!-- TOP HEADER -->

		<header class="topbar">

			<div class="topbar-left">

				<img
					src="{% static 'images/jh_logo.png' %}"
					alt="JH Classes"
					class="logo"
            >

					<div class="brand-text">

						<h2>JH CLASSES</h2>

						<p>Building a Stronger Base</p>

					</div>

				</div>


			<div class="student-info">

				<div class="student-details">

					<strong>Student Portal</strong>

					<span>JH Classes</span>

				</div>

				<div class="student-circle">
					S
				</div>

			</div>

		</header>


		<!-- SIDEBAR -->

		<nav class="sidebar">

			<div class="sidebar-title">
				Student Portal
			</div>


			<a href="/student/dashboard/">

				<span class="nav-icon">🏠</span>

				<span>Dashboard</span>

			</a>


			<a href="/student/exams/">

				<span class="nav-icon">📝</span>

				<span>My Exams</span>

			</a>


			<a href="/student/dashboard/#attendance">

				<span class="nav-icon">📅</span>

				<span>Attendance</span>

			</a>


			<div class="sidebar-divider"></div>


			<a href="/student/logout/">

				<span class="nav-icon">🚪</span>

				<span>Logout</span>

			</a>

		</nav>


		<!-- PAGE CONTENT -->

		<main class="content">

			{% block content %}

			{% endblock %}

		</main>


	</body>

</html>
