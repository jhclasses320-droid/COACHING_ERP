<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - JH Classes</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .info {
            text-align: center;
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            font-size: 14px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Forgot Password</h2>

        <p class="info">
            Enter your Student ID and registered Mobile Number.
        </p>

        {% if messages %}

            {% for message in messages %}

                <p class="error">{{ message }}</p>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="student_id"
                placeholder="Enter Student ID"
                required
            >

            <input
                type="text"
                name="mobile"
                placeholder="Enter Registered Mobile Number"
                required
            >

            <button type="submit">
                Verify
            </button>

        </form>

        <a
            href="/student/"
            class="back"
        >
            Back to Login
        </a>

    </div>

</body>

</html>
