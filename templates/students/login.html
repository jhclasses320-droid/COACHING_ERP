<!DOCTYPE html>
<html lang="en">

	<head>

		<meta charset="UTF-8">

			<meta name="viewport" content="width=device-width, initial-scale=1.0">

				<title>Student Login - JH Classes</title>

				<style>

					body {
					font-family: Arial, sans-serif;
					background: #f4f6f9;
					display: flex;
					justify-content: center;
					align-items: center;
					min-height: 100vh;
					margin: 0;
					}

					.login-box {
					background: white;
					padding: 30px;
					width: 350px;
					border-radius: 10px;
					box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
					}

					h2 {
					text-align: center;
					margin-bottom: 20px;
					}

					input {
					width: 100%;
					padding: 10px;
					margin: 8px 0;
					border-radius: 5px;
					border: 1px solid #ccc;
					box-sizing: border-box;
					}

					button {
					width: 100%;
					padding: 10px;
					margin-top: 8px;
					background: #007bff;
					color: white;
					border: none;
					border-radius: 5px;
					cursor: pointer;
					}

					button:hover {
					background: #0056b3;
					}

					.error {
					color: red;
					font-size: 14px;
					text-align: center;
					}

					.forgot {
					display: block;
					text-align: center;
					margin-top: 15px;
					color: #007bff;
					text-decoration: none;
					font-size: 14px;
					}

					.forgot:hover {
					text-decoration: underline;
					}

				</style>

			</head>

	<body>

		<div class="login-box">

			<h2>Student Login</h2>

			{% if messages %}

			{% for message in messages %}

			<p class="error">{{ message }}</p>

			{% endfor %}

			{% endif %}

			<form method="POST">

				{% csrf_token %}

				<input
					type="text"
					name="student_id"
					placeholder="Enter Student ID"
					required=""
            >

					<input
						type="password"
						name="password"
						placeholder="Enter Password"
						required=""
            >

						<button type="submit">
							Login
						</button>

					</form>

			<a
				href="/student/forgot-password/"
				class="forgot"
        >
				Forgot Password?
			</a>

		</div>

	</body>

</html>
