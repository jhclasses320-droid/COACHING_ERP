<!DOCTYPE html>
<html>
	<head>
		<title>Staff Login</title>

		<style>

			body{
			font-family: Arial, sans-serif;
			background:#f4f6f9;
			}

			.login-box{
			width:350px;
			margin:120px auto;
			background:white;
			padding:30px;
			border-radius:8px;
			box-shadow:0 0 10px rgba(0,0,0,0.15);
			}

			h2{
			text-align:center;
			margin-bottom:25px;
			}

			input{
			width:100%;
			padding:10px;
			margin:10px 0;
			border:1px solid #ccc;
			border-radius:5px;
			}

			button{
			width:100%;
			padding:12px;
			background:#007bff;
			color:white;
			border:none;
			border-radius:5px;
			font-size:16px;
			cursor:pointer;
			}

			button:hover{
			background:#0056b3;
			}


			/* ================= LOGIN MESSAGES ================= */

			.messages{
			margin-bottom:15px;
			}

			.message{
			padding:10px;
			border-radius:5px;
			background:#f8d7da;
			color:#842029;
			border:1px solid #f5c2c7;
			font-size:14px;
			text-align:center;
			}

		</style>

	</head>

	<body>

		<div class="login-box">

			<h2>Staff Login</h2>


			<!-- ================= LOGIN MESSAGES ================= -->

			{% if messages %}

			<div class="messages">

				{% for message in messages %}

				<div class="message">
					{{ message }}
				</div>

				{% endfor %}

			</div>

			{% endif %}


			<form method="post">

				{% csrf_token %}

				<input
					type="text"
					name="username"
					placeholder="Username"
>

					<input
						type="password"
						name="password"
						placeholder="Password"
>

						<button type="submit">
							Login
						</button>

					</form>

		</div>

	</body>
</html>
